<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔥 LEVEL DEVIL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none}
#wrap{position:relative;overflow:hidden}
canvas{display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:rgba(0,0,0,0.8);border-bottom:2px solid #f30;pointer-events:none;z-index:10}
.hname{color:#f30;font-weight:bold;font-size:13px;letter-spacing:2px}
.hhint{color:#fa0;font-size:10px;max-width:190px;text-align:center;line-height:1.4}
.hdk{color:#f64;font-size:13px}
#pbar{position:absolute;bottom:0;left:0;right:0;height:5px;background:#111;z-index:10}
#pfill{height:5px;background:#0f0;width:0%;transition:width .12s}
#flash{position:absolute;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:20;transition:opacity .05s}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(26px,6vw,60px);color:#f30;text-shadow:0 0 28px #f30;letter-spacing:4px;margin-bottom:10px}
#overlay p{color:#aaa;font-size:13px;max-width:380px;margin:5px auto;line-height:1.7}
.obtn{margin-top:22px;padding:14px 42px;background:#f30;border:none;color:#fff;font-size:17px;font-family:inherit;font-weight:bold;cursor:pointer;letter-spacing:2px;border-radius:3px;box-shadow:0 0 20px #f308;transition:transform .1s,background .1s}
.obtn:hover{background:#f50;transform:scale(1.04)}
.obtn:active{transform:scale(.97)}
/* mobile */
#mc{position:absolute;bottom:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:10px 18px 18px;pointer-events:none;z-index:15}
.cb{width:64px;height:64px;border-radius:50%;background:rgba(255,51,0,.22);border:2px solid #f306;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:all;-webkit-tap-highlight-color:transparent;touch-action:none}
.cb:active,.cb.held{background:rgba(255,51,0,.6)}
.lbs{display:flex;gap:12px}
@media(max-width:720px),(pointer:coarse){#mc{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hname" id="hname">FASE 1</div>
    <div class="hhint" id="hhint"></div>
    <div class="hdk">💀 <span id="hdk">0</span></div>
  </div>
  <div id="pbar"><div id="pfill"></div></div>
  <div id="flash"></div>
  <div id="mc">
    <div class="lbs">
      <div class="cb" id="bl">◀</div>
      <div class="cb" id="br">▶</div>
    </div>
    <div class="cb" id="bj">▲</div>
  </div>
  <div id="overlay">
    <h1>🔥 LEVEL DEVIL</h1>
    <p style="color:#f64;font-size:15px">5 fases · armadilhas diabólicas · você vai morrer muito</p>
    <p>← → mover &nbsp;|&nbsp; ↑ ou ESPAÇO pular &nbsp;|&nbsp; R reiniciar fase</p>
    <p style="color:#fa0;font-size:11px">A Fase 1 é um tutorial — cada seção ensina uma armadilha</p>
    <button class="obtn" id="sbtn">COMEÇAR 😈</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════
// CANVAS / RESIZE
// ═══════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('wrap');
let CW = 800, CH = 480;

function resize(){
  const w = Math.min(window.innerWidth,  900);
  const h = Math.min(window.innerHeight - 0, 540);
  CW = Math.floor(w / 32) * 32;
  CH = Math.floor(h / 32) * 32;
  canvas.width  = CW;
  canvas.height = CH;
  wrap.style.width  = CW + 'px';
  wrap.style.height = CH + 'px';
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════
// INPUT
// ═══════════════════════════════════
const KEY = {};
window.addEventListener('keydown', e => {
  KEY[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => KEY[e.code] = false);

const MB = { l:false, r:false, j:false };
function setupMobile(){
  function bind(id, k){
    const el = document.getElementById(id);
    const on  = () => { MB[k] = true;  el.classList.add('held'); };
    const off = () => { MB[k] = false; el.classList.remove('held'); };
    el.addEventListener('touchstart', e => { e.preventDefault(); on(); },  {passive:false});
    el.addEventListener('touchend',   e => { e.preventDefault(); off(); }, {passive:false});
    el.addEventListener('mousedown',  on);
    el.addEventListener('mouseup',    off);
  }
  bind('bl','l'); bind('br','r'); bind('bj','j');
}

const isLeft  = () => KEY.ArrowLeft  || KEY.KeyA || MB.l;
const isRight = () => KEY.ArrowRight || KEY.KeyD || MB.r;
const isJump  = () => KEY.ArrowUp    || KEY.Space || KEY.KeyW || MB.j;

// ═══════════════════════════════════
// PHYSICS CONSTANTS  (tuned)
// ─  jump height  ≈ 128 px
// ─  jump dist    ≈ 210 px (full speed)
// ═══════════════════════════════════
const GRAV    = 0.55;
const JFORCE  = -12.0;
const PSPEED  = 4.0;
const COYOTE  = 7;   // frames of coyote time

// ═══════════════════════════════════
// PLAYER
// ═══════════════════════════════════
let P;
function makePlayer(x, y){
  return { x, y, w:20, h:28,
    vx:0, vy:0, onGround:false,
    dead:false, jumpHeld:false,
    coyote:0, face:1, af:0, at:0 };
}

function updatePlayer(platforms){
  if (P.dead) return;

  // horizontal
  if (isLeft())       { P.vx = -PSPEED; P.face = -1; }
  else if (isRight()) { P.vx =  PSPEED; P.face =  1; }
  else                { P.vx *= 0.65; if (Math.abs(P.vx) < 0.15) P.vx = 0; }

  // jump
  const jp = isJump();
  if (jp && !P.jumpHeld && P.coyote > 0){
    P.vy = JFORCE; P.jumpHeld = true; P.coyote = 0;
  }
  if (!jp) P.jumpHeld = false;

  // gravity
  P.vy = Math.min(P.vy + GRAV, 20);

  // move X + collide
  P.x += P.vx;
  const LW = curLvl.w * 32;
  if (P.x < 0)        { P.x = 0;        P.vx = 0; }
  if (P.x + P.w > LW) { P.x = LW - P.w; P.vx = 0; }
  for (const pl of platforms){
    if (overlap(P, pl)){
      if (P.vx > 0) P.x = pl.x - P.w;
      else          P.x = pl.x + pl.w;
      P.vx = 0;
    }
  }

  // move Y + collide
  P.onGround = false;
  P.y += P.vy;
  for (const pl of platforms){
    if (overlap(P, pl)){
      if (P.vy > 0){ P.y = pl.y - P.h; P.onGround = true; }
      else          { P.y = pl.y + pl.h; }
      P.vy = 0;
    }
  }

  // coyote
  if (P.onGround) P.coyote = COYOTE;
  else if (P.coyote > 0) P.coyote--;

  // void death
  if (P.y > curLvl.h * 32 + 200) die();

  // anim
  if (++P.at > 7){ P.at = 0; P.af = (P.af + 1) % 4; }
}

function overlap(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ═══════════════════════════════════
// DEATH / RESPAWN
// ═══════════════════════════════════
let deaths = 0;
let deathCb = null;

function die(){
  if (P.dead) return;
  P.dead = true;
  deaths++;
  document.getElementById('hdk').textContent = deaths;
  burst(P.x + P.w/2, P.y + P.h/2, '#f40', 14);
  const fl = document.getElementById('flash');
  fl.style.opacity = '0.75';
  setTimeout(() => fl.style.opacity = '0', 130);
  setTimeout(() => { if (deathCb) deathCb(); }, 520);
}

// ═══════════════════════════════════
// CAMERA
// ═══════════════════════════════════
let camX = 0, camY = 0;
function updateCam(){
  const tx = P.x - CW/2 + P.w/2;
  const ty = P.y - CH/2 + P.h/2;
  camX += (tx - camX) * 0.10;
  camY += (ty - camY) * 0.10;
  camX = Math.max(0, Math.min(curLvl.w*32 - CW, camX));
  camY = Math.max(0, Math.min(curLvl.h*32 - CH, camY));
}

// screen coords helper
const sx = (x) => x - camX;
const sy = (y) => y - camY;

// ═══════════════════════════════════
// PARTICLES
// ═══════════════════════════════════
let parts = [];
function burst(x, y, col, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1.5,
                 life: 1, col, r: 2 + Math.random() * 3 });
  }
}
function updateParts(){
  parts = parts.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= 0.028;
    return p.life > 0;
  });
}
function drawParts(){
  for (const p of parts){
    ctx.save(); ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════
// DRAW HELPERS
// ═══════════════════════════════════
function drawPlayer(){
  if (P.dead) return;
  const x = sx(P.x + P.w/2), y = sy(P.y);
  ctx.save(); ctx.translate(x, y); ctx.scale(P.face, 1);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-12, P.h+1, 24, 5);

  // legs
  ctx.fillStyle = '#cc2200';
  const lg = P.onGround && P.vx !== 0 ? Math.sin(P.af * Math.PI/2) * 6 : 0;
  ctx.fillRect(-10, 18, 8, 12 + lg);
  ctx.fillRect(  2, 18, 8, 12 - lg);

  // body
  ctx.fillStyle = '#f30'; ctx.fillRect(-11, 0, 22, 20);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(-8, 2, 6, 10);

  // head
  ctx.fillStyle = '#ffbb77'; ctx.fillRect(-9, -14, 18, 15);
  ctx.fillStyle = '#550000'; ctx.fillRect(-9, -15, 18, 5); // hair

  // eyes
  ctx.fillStyle = '#111';
  ctx.fillRect(-6, -11, 4, 5); ctx.fillRect(2, -11, 4, 5);
  ctx.fillStyle = '#550000'; // angry brows
  ctx.fillRect(-7, -13, 5, 2); ctx.fillRect(2, -13, 5, 2);
  ctx.fillStyle = '#f00'; // glow
  ctx.fillRect(-5, -10, 2, 2); ctx.fillRect(3, -10, 2, 2);

  // arms
  ctx.fillStyle = '#ffbb77';
  ctx.fillRect(-17, 2, 6, 11); ctx.fillRect(11, 2, 6, 11);

  ctx.restore();
}

function drawPlatforms(plats){
  for (const p of plats){
    const px = sx(p.x), py = sy(p.y);
    if (px > CW+64 || px+p.w < -64 || py > CH+64 || py+p.h < -64) continue;
    ctx.fillStyle = p.c || curLvl.pc || '#334455';
    ctx.fillRect(px, py, p.w, p.h);
    ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(px, py, p.w, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';       ctx.fillRect(px, py+p.h-3, p.w, 3);
  }
}

function drawGoal(g){
  const gx = sx(g.x), gy = sy(g.y), t = Date.now()/500;
  ctx.save();
  ctx.globalAlpha = 0.25 + Math.sin(t)*0.15;
  ctx.fillStyle = '#ff0'; ctx.fillRect(gx-8, gy-8, g.w+16, g.h+16);
  ctx.restore();
  ctx.fillStyle = '#cc8800'; ctx.fillRect(gx, gy, g.w, g.h);
  ctx.fillStyle = '#ffcc00'; ctx.fillRect(gx+3, gy+3, g.w-6, g.h-6);
  ctx.fillStyle = '#884400'; ctx.fillRect(gx+g.w/2-4, gy+g.h-18, 8, 18);
  ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.fillText('⭐', gx+g.w/2, gy+22);
}

function drawBG(){
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, curLvl.sky0 || '#08081a');
  g.addColorStop(1, curLvl.sky1 || '#150808');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  if (curLvl.stars){
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (const s of curLvl.stars){
      ctx.fillRect(((s.x - camX*0.12)%CW+CW)%CW, ((s.y - camY*0.07)%CH+CH)%CH, s.r, s.r);
    }
  }
}

function dist(x1,y1,x2,y2){ const dx=x1-x2,dy=y1-y2; return Math.sqrt(dx*dx+dy*dy); }

// ═══════════════════════════════════
// TRAPS
// ═══════════════════════════════════

// ── SPIKE (floor, points up) ──
function drawSpike(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||32, h=t.h||18, n=Math.floor(w/14);
  ctx.fillStyle='#667788'; ctx.fillRect(x, y+h-5, w, 5);
  for(let i=0;i<n;i++){
    ctx.fillStyle='#99aabb';
    ctx.beginPath(); ctx.moveTo(x+i*14+7,y); ctx.lineTo(x+i*14,y+h-4); ctx.lineTo(x+i*14+14,y+h-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.moveTo(x+i*14+7,y+2); ctx.lineTo(x+i*14+3,y+h-6); ctx.lineTo(x+i*14+8,y+h-6); ctx.closePath(); ctx.fill();
  }
}
function checkSpike(t){ return overlap(P,{x:t.x,y:t.y,w:t.w||32,h:t.h||18}); }

// ── SPIKE DOWN (ceiling) ──
function drawSpikeDown(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||32, h=t.h||18, n=Math.floor(w/14);
  ctx.fillStyle='#667788'; ctx.fillRect(x, y, w, 5);
  for(let i=0;i<n;i++){
    ctx.fillStyle='#99aabb';
    ctx.beginPath(); ctx.moveTo(x+i*14+7,y+h); ctx.lineTo(x+i*14,y+4); ctx.lineTo(x+i*14+14,y+4); ctx.closePath(); ctx.fill();
  }
}
function checkSpikeDown(t){ return overlap(P,{x:t.x,y:t.y,w:t.w||32,h:t.h||18}); }

// ── SAW BLADE ──
function initSaw(t){ t._a=0; t._ox=t.x; t._oy=t.y; }
function updateSaw(t){
  t._a += t.rspd||0.14;
  if(t.mx) t.x = t._ox + Math.sin(Date.now()/(t.mspd||700)) * t.mx;
  if(t.my) t.y = t._oy + Math.sin(Date.now()/(t.mspd||700)) * t.my;
}
function drawSaw(t){
  const x=sx(t.x), y=sy(t.y), r=t.r||18;
  ctx.save(); ctx.translate(x,y); ctx.rotate(t._a);
  ctx.shadowColor='#f80'; ctx.shadowBlur=14;
  const n=10;
  ctx.fillStyle='#aabbcc';
  for(let i=0;i<n;i++){
    ctx.save(); ctx.rotate(i/n*Math.PI*2);
    ctx.fillRect(-3,-r-9,6,11); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle='#778899'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,r*.55,0,Math.PI*2); ctx.fillStyle='#99aabb'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fillStyle='#334'; ctx.fill();
  ctx.restore();
}
function checkSaw(t){ return dist(P.x+P.w/2, P.y+P.h/2, t.x, t.y) < (t.r||18)+8; }

// ── FIREBALL ──
function initFireball(t){ t._ox=t.x; t._dir=t.dir||1; }
function updateFireball(t){
  t.x += (t.spd||3) * t._dir;
  if(t.x > t._ox+(t.range||200) || t.x < t._ox-(t.range||0)) t._dir *= -1;
}
function drawFireball(t){
  const x=sx(t.x), y=sy(t.y), r=t.r||13;
  // trail
  ctx.save(); ctx.globalAlpha=0.3;
  ctx.fillStyle='#f60';
  ctx.beginPath(); ctx.ellipse(x-t._dir*r,y,r*1.4,r*.6,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // core
  const g=ctx.createRadialGradient(x,y,1,x,y,r);
  g.addColorStop(0,'#fff'); g.addColorStop(0.3,'#ffcc00'); g.addColorStop(0.7,'#ff4400'); g.addColorStop(1,'rgba(200,0,0,0)');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
}
function checkFireball(t){ return dist(P.x+P.w/2, P.y+P.h/2, t.x, t.y) < (t.r||13)+8; }

// ── LASER (horizontal) ──
function initLaser(t){ t._tick=0; t._on=false; }
function updateLaser(t){
  t._tick++;
  // off for `offT` frames, on for `onT` frames
  const cycle = (t.offT||50) + (t.onT||30);
  const phase = t._tick % cycle;
  t._on = phase >= (t.offT||50);
}
function drawLaser(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||200;
  // emitter boxes
  ctx.fillStyle='#334456';
  ctx.fillRect(x-8,y-12,16,24); ctx.fillRect(x+w-8,y-12,16,24);
  ctx.fillStyle='#556';
  ctx.fillRect(x-4,y-8,8,16); ctx.fillRect(x+w-4,y-8,8,16);

  if(!t._on){
    // warning blink
    const blink = Math.floor(t._tick/8)%2;
    if(blink){ ctx.fillStyle='rgba(255,50,50,0.2)'; ctx.fillRect(x,y-3,w,6); }
    return;
  }
  ctx.save();
  ctx.shadowColor='#f00'; ctx.shadowBlur=22;
  const bg=ctx.createLinearGradient(x,y,x+w,y);
  bg.addColorStop(0,'rgba(255,0,0,0)'); bg.addColorStop(.06,'#ff0000'); bg.addColorStop(.94,'#ff0000'); bg.addColorStop(1,'rgba(255,0,0,0)');
  ctx.fillStyle=bg; ctx.fillRect(x,y-4,w,8);
  ctx.fillStyle='rgba(255,180,180,.85)'; ctx.fillRect(x+w*.06,y-1,w*.88,2);
  ctx.globalAlpha=.18; ctx.fillStyle='#f00'; ctx.fillRect(x,y-14,w,28);
  ctx.restore();
}
function checkLaser(t){ return t._on && overlap(P,{x:t.x,y:t.y-4,w:t.w||200,h:8}); }

// ── LASER VERTICAL ──
function initLaserV(t){ t._tick=0; t._on=false; }
function updateLaserV(t){
  t._tick++;
  const cycle = (t.offT||55) + (t.onT||25);
  const phase = t._tick % cycle;
  t._on = phase >= (t.offT||55);
}
function drawLaserV(t){
  const x=sx(t.x), y=sy(t.y), h=t.h||160;
  ctx.fillStyle='#334456';
  ctx.fillRect(x-12,y-8,24,16); ctx.fillRect(x-12,y+h-8,24,16);
  if(!t._on){
    const blink=Math.floor(t._tick/8)%2;
    if(blink){ ctx.fillStyle='rgba(200,0,200,0.2)'; ctx.fillRect(x-3,y,6,h); }
    return;
  }
  ctx.save();
  ctx.shadowColor='#f0f'; ctx.shadowBlur=22;
  ctx.fillStyle='#cc00cc'; ctx.fillRect(x-3,y,6,h);
  ctx.fillStyle='rgba(255,100,255,.85)'; ctx.fillRect(x-1,y,2,h);
  ctx.globalAlpha=.18; ctx.fillStyle='#f0f'; ctx.fillRect(x-13,y,26,h);
  ctx.restore();
}
function checkLaserV(t){ return t._on && overlap(P,{x:t.x-12,y:t.y,w:24,h:t.h||160}); }

// ── CRUSHER ──
function initCrusher(t){ t._phase='idle'; t._vy=0; t._oy=t.y; t._warn=0; }
function updateCrusher(t){
  if(t._phase==='idle'){
    // trigger if player is below and within X range
    if(!P.dead && P.x+P.w > t.x && P.x < t.x+t.w && P.y > t.y){
      t._warn++;
      if(t._warn > 20){ t._phase='fall'; t._warn=0; }
    } else t._warn=0;
  }
  if(t._phase==='fall'){
    t._vy = Math.min(t._vy+1.4, 22);
    t.y  += t._vy;
    if(t.y > t._oy + (t.dist||200)){ t._phase='reset'; t._vy=0; }
  }
  if(t._phase==='reset'){
    t.y -= 5;
    if(t.y <= t._oy){ t.y=t._oy; t._phase='idle'; }
  }
}
function drawCrusher(t){
  // chain links
  const links = Math.max(0, Math.floor((t.y - t._oy)/14));
  for(let i=0;i<links;i++){
    ctx.fillStyle = i%2 ? '#445' : '#667';
    ctx.fillRect(sx(t.x+t.w/2-5), sy(t._oy)+i*14, 10, 12);
  }
  const x=sx(t.x), y=sy(t.y), w=t.w||48, h=t.h||38;
  // warn flash
  if(t._warn > 5){
    ctx.save(); ctx.globalAlpha=0.5+Math.sin(Date.now()/60)*0.4;
    ctx.fillStyle='#ff0'; ctx.fillRect(x,y,w,4); ctx.restore();
  }
  ctx.fillStyle='#556677'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,w,4);
  // spikes on bottom
  const sn=Math.floor(w/12); ctx.fillStyle='#aabbcc';
  for(let i=0;i<sn;i++){
    ctx.beginPath(); ctx.moveTo(x+i*12+6,y+h+10); ctx.lineTo(x+i*12,y+h); ctx.lineTo(x+i*12+12,y+h); ctx.closePath(); ctx.fill();
  }
}
function checkCrusher(t){ return overlap(P,{x:t.x,y:t.y+t.h-2,w:t.w||48,h:14}); }

// ── GEYSER ──
function initGeyser(t){ t._tick=0; t._on=false; }
function updateGeyser(t){
  t._tick++;
  const cycle = (t.offT||50) + (t.onT||35);
  const phase = (t._tick + (t.offset||0)) % cycle;
  t._on = phase >= (t.offT||50);
}
function drawGeyser(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||28, fh=t.fh||90;
  ctx.fillStyle='#554433'; ctx.fillRect(x,y,w,10);
  ctx.fillStyle='#776655'; ctx.fillRect(x+3,y,w-6,6);
  if(!t._on){
    // warning steam
    const blink=Math.floor(t._tick/12)%2;
    if(blink){ ctx.fillStyle='rgba(255,150,50,0.2)'; ctx.fillRect(x+w/2-6,y-20,12,20); }
    return;
  }
  for(let layer=2;layer>=0;layer--){
    const fw=w*(1-layer*0.18), lh=fh*(1-layer*0.12);
    const gj=ctx.createLinearGradient(x,y-lh,x,y);
    gj.addColorStop(0,'rgba(255,200,0,0)'); gj.addColorStop(0.35,'rgba(255,100,0,0.85)'); gj.addColorStop(1,'rgba(255,220,0,1)');
    ctx.fillStyle=gj; ctx.fillRect(x+(w-fw)/2,y-lh,fw,lh);
  }
}
function checkGeyser(t){ return t._on && overlap(P,{x:t.x+4,y:t.y-(t.fh||90),w:(t.w||28)-8,h:t.fh||90}); }

// ── MOVING PLATFORM (also a platform) ──
function initMovPlat(t){ t._ph=0; t._ox=t.x; t._oy=t.y; t._px=t.x; t._py=t.y; }
function updateMovPlat(t){
  const prevX=t.x, prevY=t.y;
  t._ph += 0.018 * (t.mspd||1);
  if(t.mx) t.x = t._ox + Math.sin(t._ph)*t.mx;
  if(t.my) t.y = t._oy + Math.sin(t._ph)*t.my;
  // carry player
  if(!P.dead && P.onGround){
    const onPlat = P.x+P.w > t.x && P.x < t.x+t.w && Math.abs((P.y+P.h) - t.y) < 6;
    if(onPlat){ P.x += t.x - prevX; P.y += t.y - prevY; }
  }
}
function drawMovPlat(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||80, h=t.h||14;
  ctx.save(); ctx.shadowColor='#48f'; ctx.shadowBlur=8;
  ctx.fillStyle='#224488'; ctx.fillRect(x,y,w,h);
  ctx.restore();
  ctx.fillStyle='rgba(100,180,255,0.18)'; ctx.fillRect(x,y,w,4);
  ctx.fillStyle='rgba(100,180,255,0.55)'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText(t.mx?'↔':'↕', x+w/2, y+h/2+4);
}

// ── DISAPPEARING PLATFORM ──
function initDisappear(t){ t._vis=true; t._stepped=false; t._timer=0; }
function updateDisappear(t){
  const onTop = !P.dead && P.y+P.h >= t.y && P.y+P.h <= t.y+10 &&
                P.x+P.w > t.x && P.x < t.x+t.w && P.vy >= 0;
  if(onTop && t._vis) t._stepped=true;
  if(t._stepped) t._timer++;
  if(t._timer > 38 && t._vis){ t._vis=false; t._timer=0; }
  if(!t._vis){ t._timer++; if(t._timer > 160){ t._vis=true; t._stepped=false; t._timer=0; } }
}
function drawDisappear(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||64, h=14;
  if(!t._vis){
    ctx.save(); ctx.globalAlpha=0.12; ctx.strokeStyle='#4f4'; ctx.lineWidth=2;
    ctx.strokeRect(x,y,w,h); ctx.restore(); return;
  }
  const alpha = t._stepped ? 0.35+Math.sin(Date.now()/55)*0.45 : 1;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle='#2a6b2a'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(80,255,80,0.22)'; ctx.fillRect(x,y,w,4);
  if(t._stepped && t._timer>20){
    ctx.strokeStyle='rgba(255,80,80,0.6)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+w*.3,y); ctx.lineTo(x+w*.2,y+h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w*.7,y); ctx.lineTo(x+w*.8,y+h); ctx.stroke();
  }
  ctx.restore();
}

// ── ARROW SHOOTER ──
function initArrow(t){ t._tick=0; t._arrows=[]; }
function updateArrow(t){
  t._tick++;
  if(t._tick % (t.rate||80) === 0) t._arrows.push({x:t.x+(t.dir>0?30:0), y:t.y+14, vx:t.dir*7});
  t._arrows = t._arrows.filter(a => { a.x+=a.vx; return a.x>-300&&a.x<curLvl.w*32+300; });
}
function drawArrow(t){
  const x=sx(t.x), y=sy(t.y);
  ctx.fillStyle='#445566'; ctx.fillRect(x,y,28,28);
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x,y,28,4);
  // barrel
  const bx = t.dir>0 ? x+28 : x-16;
  ctx.fillStyle='#667788'; ctx.fillRect(bx,y+9,16,10);
  // arrows
  for(const a of t._arrows){
    const ax=sx(a.x), ay=sy(a.y);
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(a.vx>0?0:Math.PI);
    ctx.fillStyle='#8B5E3C'; ctx.fillRect(-16,-2,28,4);
    ctx.fillStyle='#aabbcc'; ctx.beginPath(); ctx.moveTo(12,-6); ctx.lineTo(20,0); ctx.lineTo(12,6); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#cc8844';
    ctx.beginPath(); ctx.moveTo(-16,-2); ctx.lineTo(-24,-8); ctx.lineTo(-14,-2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-16,2);  ctx.lineTo(-24,8);  ctx.lineTo(-14,2);  ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function checkArrow(t){ return t._arrows.some(a => overlap(P,{x:a.x-14,y:a.y-4,w:28,h:8})); }

// ── LAVA ──
function drawLava(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||96, h=t.h||22, tick=Date.now()/300;
  const lg=ctx.createLinearGradient(x,y,x,y+h);
  lg.addColorStop(0,'#ff5500'); lg.addColorStop(1,'#881100');
  ctx.fillStyle=lg; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,150,0,0.45)';
  for(let i=0;i<4;i++){
    const bx=x+((tick*40+i*w/4)%w+w)%w;
    ctx.beginPath(); ctx.arc(bx,y+4,6,Math.PI,0); ctx.fill();
  }
  ctx.save(); ctx.globalAlpha=0.25+Math.sin(tick*2)*0.1;
  const gg=ctx.createLinearGradient(x,y-14,x,y+5);
  gg.addColorStop(0,'rgba(255,100,0,0)'); gg.addColorStop(1,'rgba(255,100,0,0.6)');
  ctx.fillStyle=gg; ctx.fillRect(x,y-14,w,16); ctx.restore();
}
function checkLava(t){ return overlap(P,{x:t.x,y:t.y,w:t.w||96,h:t.h||22}); }

// ── GHOST ──
function initGhost(t){ t._x=t.x; t._y=t.y; }
function updateGhost(t){
  if(P.dead) return;
  const dx=P.x-t._x, dy=P.y-t._y, d=Math.sqrt(dx*dx+dy*dy)||1;
  t._x += dx/d*(t.spd||1.1); t._y += dy/d*(t.spd||1.1);
}
function drawGhost(t){
  const x=sx(t._x), y=sy(t._y), bob=Math.sin(Date.now()/360)*5;
  ctx.save(); ctx.globalAlpha=0.75;
  ctx.fillStyle='#cceeff';
  ctx.beginPath(); ctx.arc(x,y+bob-8,18,Math.PI,0,false);
  ctx.lineTo(x+18,y+bob+14);
  for(let i=4;i>=0;i--) ctx.quadraticCurveTo(x+18-i*9+4,y+bob+18+(i%2?5:-5),x+18-i*9-5,y+bob+12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1a1a3a';
  ctx.beginPath(); ctx.ellipse(x-6,y+bob-11,4,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+6,y+bob-11,4,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f36';
  ctx.beginPath(); ctx.arc(x-5,y+bob-11,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,y+bob-11,2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function checkGhost(t){ return dist(P.x+P.w/2,P.y+P.h/2,t._x,t._y)<26; }

// ── WRECKING BALL ──
function initWreck(t){ t._a=t.startA||0; t._av=t.av||0.04; t._adir=1; }
function updateWreck(t){ t._a += t._av*t._adir; if(Math.abs(t._a)>0.9) t._adir*=-1; }
function drawWreck(t){
  const px=sx(t.x), py=sy(t.y), len=t.len||85, r=t.r||22;
  const bx=px+Math.sin(t._a)*len, by=py+Math.cos(t._a)*len;
  ctx.fillStyle='#445'; ctx.beginPath(); ctx.arc(px,py,8,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#667'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(bx,by); ctx.stroke();
  ctx.save(); ctx.shadowColor='#f80'; ctx.shadowBlur=16;
  ctx.fillStyle='#556677'; ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#99aaaa';
  for(let i=0;i<8;i++){
    const sa=t._a+i/8*Math.PI*2;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(sa);
    ctx.fillRect(-3,-r-10,6,12); ctx.restore();
  }
  ctx.fillStyle='#334'; ctx.beginPath(); ctx.arc(bx,by,6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function checkWreck(t){
  const bx=t.x+Math.sin(t._a)*(t.len||85), by=t.y+Math.cos(t._a)*(t.len||85);
  return dist(P.x+P.w/2,P.y+P.h/2,bx,by)<(t.r||22)+10;
}

// ── LIGHTNING ──
function initLightning(t){ t._tick=0; t._on=false; }
function updateLightning(t){
  t._tick++;
  const cycle=(t.offT||70)+(t.onT||12);
  const phase=t._tick%cycle;
  t._on=phase>=(t.offT||70);
}
function drawLightning(t){
  const x=sx(t.x), y=sy(t.y), h=t.h||130;
  const charge=((t._tick%(  (t.offT||70)+(t.onT||12)  )) / (t.offT||70));
  if(!t._on){
    if(charge>0.7){ ctx.save(); ctx.globalAlpha=(charge-0.7)/0.3*0.25; ctx.fillStyle='#ff0'; ctx.fillRect(x-18,y,36,h); ctx.restore(); }
    return;
  }
  ctx.save(); ctx.shadowColor='#ff0'; ctx.shadowBlur=30;
  ctx.strokeStyle='#ffff88'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(x,y);
  let cy=y;
  for(let i=0;i<8;i++){ cy+=h/8; ctx.lineTo(x+(Math.random()-.5)*28,cy); }
  ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.globalAlpha=0.22; ctx.fillStyle='#ff0'; ctx.fillRect(x-20,y,40,h);
  ctx.restore();
}
function checkLightning(t){ return t._on && overlap(P,{x:t.x-18,y:t.y,w:36,h:t.h||130}); }

// ── PENDULUM AXE ──
function initPend(t){ t._a=0; t._av=0.032; t._adir=1; }
function updatePend(t){ t._a+=t._av*t._adir; if(Math.abs(t._a)>0.9) t._adir*=-1; }
function drawPend(t){
  const px=sx(t.x), py=sy(t.y), len=t.len||75;
  const ex=px+Math.sin(t._a)*len, ey=py+Math.cos(t._a)*len;
  ctx.fillStyle='#556'; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#778'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.save(); ctx.translate(ex,ey); ctx.rotate(t._a+Math.PI/4);
  ctx.shadowColor='#f80'; ctx.shadowBlur=10;
  ctx.fillStyle='#889999'; ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(20,14); ctx.lineTo(-20,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#aabbbb'; ctx.fillRect(-4,-20,8,34);
  ctx.restore();
}
function checkPend(t){
  const bx=t.x+Math.sin(t._a)*(t.len||75), by=t.y+Math.cos(t._a)*(t.len||75);
  return dist(P.x+P.w/2,P.y+P.h/2,bx,by)<26;
}

// ── SPIN BLADE ──
function initSpin(t){ t._a=0; }
function updateSpin(t){ t._a+=(t.rspd||0.06); }
function drawSpin(t){
  const x=sx(t.x), y=sy(t.y), len=t.len||50;
  ctx.fillStyle='#445'; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(x,y); ctx.shadowColor='#f80'; ctx.shadowBlur=8;
  for(let arm=0;arm<2;arm++){
    ctx.save(); ctx.rotate(t._a+arm*Math.PI);
    ctx.fillStyle='#99aaaa'; ctx.fillRect(0,-5,len,10);
    ctx.fillStyle='#bbcccc'; ctx.beginPath(); ctx.moveTo(len,-8); ctx.lineTo(len+12,0); ctx.lineTo(len,8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function checkSpin(t){
  for(let arm=0;arm<2;arm++){
    const a=t._a+arm*Math.PI;
    for(let s=0;s<=(t.len||50);s+=5){
      const bx=t.x+Math.cos(a)*s, by=t.y+Math.sin(a)*s;
      if(bx>P.x&&bx<P.x+P.w&&by>P.y&&by<P.y+P.h) return true;
    }
  }
  return false;
}

// ── SPIKE RING ──
function initRing(t){ t._a=0; }
function updateRing(t){ t._a+=(t.rspd||0.05); }
function drawRing(t){
  const x=sx(t.x), y=sy(t.y), r=t.r||32, n=t.n||6;
  ctx.fillStyle='#445'; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
  for(let i=0;i<n;i++){
    const ang=t._a+i/n*Math.PI*2;
    const bx=x+Math.cos(ang)*r, by=y+Math.sin(ang)*r;
    ctx.strokeStyle='#556677'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(bx,by); ctx.stroke();
    ctx.save(); ctx.translate(bx,by); ctx.rotate(ang+Math.PI/2);
    ctx.fillStyle='#aabbcc'; ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(8,8); ctx.lineTo(-8,8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function checkRing(t){
  const n=t.n||6;
  for(let i=0;i<n;i++){
    const ang=t._a+i/n*Math.PI*2;
    if(dist(P.x+P.w/2,P.y+P.h/2,t.x+Math.cos(ang)*(t.r||32),t.y+Math.sin(ang)*(t.r||32))<15) return true;
  }
  return false;
}

// ── BOSS LASER ──
function initBossLaser(t){ t._a=t.startA||0; }
function updateBossLaser(t){ t._a+=(t.rspd||0.025); }
function drawBossLaser(t){
  const x=sx(t.x), y=sy(t.y), len=t.len||280, a=t._a;
  const ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len;
  ctx.save();
  ctx.shadowColor='#f40'; ctx.shadowBlur=30;
  ctx.fillStyle='#f22'; ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';  ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
  const bg=ctx.createLinearGradient(x,y,ex,ey);
  bg.addColorStop(0,'#fff'); bg.addColorStop(.08,'#ff4400'); bg.addColorStop(.92,'#ff2200'); bg.addColorStop(1,'rgba(200,0,0,0)');
  ctx.strokeStyle=bg; ctx.lineWidth=10; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.strokeStyle='rgba(255,220,180,.9)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.globalAlpha=.14; ctx.strokeStyle='#f80'; ctx.lineWidth=28;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.restore();
}
function checkBossLaser(t){
  const a=t._a, len=t.len||280;
  for(let i=2;i<len;i+=6){
    const bx=t.x+Math.cos(a)*i, by=t.y+Math.sin(a)*i;
    if(bx>P.x&&bx<P.x+P.w&&by>P.y&&by<P.y+P.h) return true;
  }
  return false;
}

// ── DARK ZONE ──
function drawDark(t){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,0.93)'; ctx.fillRect(sx(t.x),sy(t.y),t.w,t.h);
  ctx.globalAlpha=0.22+Math.sin(Date.now()/600)*0.12; ctx.font='30px sans-serif'; ctx.textAlign='center';
  ctx.fillText('☠',sx(t.x)+t.w/2,sy(t.y)+t.h/2+10); ctx.restore();
}

// ── CRUMBLE PLATFORM ──
function initCrumble(t){ t._cracks=0; t._timer=0; t._broken=false; t._rt=0; }
function updateCrumble(t){
  if(t._broken){ t._rt++; if(t._rt>200){t._broken=false;t._cracks=0;t._rt=0;} return; }
  const onTop=!P.dead&&P.y+P.h>=t.y&&P.y+P.h<=t.y+10&&P.x+P.w>t.x&&P.x<t.x+(t.w||64)&&P.vy>=0;
  if(onTop){ t._timer++; if(t._timer>7){t._cracks=Math.min(3,t._cracks+1);t._timer=0;} }
  if(t._cracks>=3) t._broken=true;
}
function drawCrumble(t){
  if(t._broken) return;
  const x=sx(t.x), y=sy(t.y), w=t.w||64, h=14;
  ctx.fillStyle=['#4a5566','#3a4455','#2a3344','#1a2233'][t._cracks||0];
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,w,3);
  ctx.strokeStyle='rgba(255,100,50,0.7)'; ctx.lineWidth=1;
  for(let c=0;c<t._cracks;c++){
    ctx.beginPath(); ctx.moveTo(x+15+c*15,y); ctx.lineTo(x+8+c*15,y+h); ctx.stroke();
  }
}

// ── CONVEYOR ──
function drawConveyor(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||120, h=14, spd=Date.now()/60*(t.dir||1);
  ctx.fillStyle='#334'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#556677';
  for(let i=0;i<6;i++){
    const bx=x+((spd+i*30)%w+w)%w;
    if(bx+4<x+w) ctx.fillRect(bx,y,4,h);
  }
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(x,y,w,3);
  ctx.fillStyle='rgba(100,200,255,0.5)'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText(t.dir>0?'→→':'←←',x+w/2,y+h/2+4);
}
function updateConveyor(t){ if(!P.dead&&overlap(P,{x:t.x,y:t.y,w:t.w||120,h:14})&&P.onGround) P.vx+=(t.dir||1)*0.5; }

// ── ICE ──
function drawIce(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||96, h=14;
  ctx.fillStyle='#88ccff'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(x,y,w,3);
  ctx.fillStyle='rgba(200,240,255,0.4)';
  for(let i=0;i<3;i++) ctx.fillRect(x+8+i*30,y+4,14,5);
}
function updateIce(t){ if(!P.dead&&overlap(P,{x:t.x,y:t.y,w:t.w||96,h:14})&&P.onGround) P.vx*=1.08; }

// ── TELEPORT TRAP ──
function initTeleport(t){ t._cd=0; }
function updateTeleport(t){
  if(t._cd>0){t._cd--;return;}
  if(!P.dead && overlap(P,{x:t.x,y:t.y,w:32,h:32})){
    burst(P.x+P.w/2,P.y+P.h/2,'#cc00ff',12);
    P.x=t.dx; P.y=t.dy; P.vx=0; P.vy=0; t._cd=60;
  }
}
function drawTeleport(t){
  const x=sx(t.x), y=sy(t.y), tick=Date.now()/300;
  ctx.save(); ctx.globalAlpha=0.65+Math.sin(tick)*0.2; ctx.shadowColor='#cc00ff'; ctx.shadowBlur=20;
  ctx.fillStyle='rgba(180,0,255,0.8)'; ctx.fillRect(x,y,32,32);
  ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
  ctx.fillText('?',x+16,y+22); ctx.restore();
}

// ── BOUNCE BALL ──
function initBounce(t){ t._vx=t.ivx||2.5; t._vy=t.ivy||-4; }
function updateBounce(t,lvl){
  t._vy=Math.min(t._vy+0.45,18); t.x+=t._vx; t.y+=t._vy;
  if(t.y>lvl.h*32-30){t.y=lvl.h*32-30;t._vy*=-0.85;}
  if(t.x<0||t.x>lvl.w*32){t._vx*=-1;}
}
function drawBounce(t){
  const x=sx(t.x), y=sy(t.y), r=t.r||13;
  ctx.save(); ctx.shadowColor='#ee44ff'; ctx.shadowBlur=12;
  const bg=ctx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);
  bg.addColorStop(0,'#ff88ff'); bg.addColorStop(1,'#880099');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle='#ff44ff'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
function checkBounce(t){ return dist(P.x+P.w/2,P.y+P.h/2,t.x,t.y)<(t.r||13)+10; }

// ── ACID DRIP ──
function initAcid(t){ t._drops=[]; t._tick=0; }
function updateAcid(t){
  t._tick++;
  if(t._tick%(t.rate||50)===0) t._drops.push({x:t.x+8+Math.random()*(t.w-16),y:t.y+8,vy:1,r:4+Math.random()*4});
  t._drops=t._drops.filter(d=>{d.vy+=0.4;d.y+=d.vy;return d.y<curLvl.h*32;});
}
function drawAcid(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||80;
  ctx.fillStyle='#223311'; ctx.fillRect(x,y,w,8);
  ctx.fillStyle='rgba(120,255,0,0.55)';
  for(let i=0;i<Math.floor(w/18);i++) ctx.fillRect(x+4+i*18,y,10,8);
  for(const d of t._drops){
    const dg=ctx.createRadialGradient(sx(d.x),sy(d.y),1,sx(d.x),sy(d.y),d.r);
    dg.addColorStop(0,'#aaff00'); dg.addColorStop(1,'rgba(80,200,0,0)');
    ctx.beginPath(); ctx.arc(sx(d.x),sy(d.y),d.r,0,Math.PI*2); ctx.fillStyle=dg; ctx.fill();
  }
}
function checkAcid(t){ return t._drops.some(d=>dist(P.x+P.w/2,P.y+P.h/2,d.x,d.y)<d.r+8); }

// ── SPIKE WALL (moving horizontal) ──
function initSpikeWall(t){ t._ox=t.x; t._dir=1; }
function updateSpikeWall(t){ t.x+=t._dir*(t.spd||2); if(t.x>t._ox+(t.range||150)||t.x<t._ox) t._dir*=-1; }
function drawSpikeWall(t){
  const x=sx(t.x), y=sy(t.y), w=16, h=t.h||80;
  ctx.fillStyle='#445566'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x,y,3,h);
  const sn=Math.floor(h/16); ctx.fillStyle='#99aaaa';
  for(let i=0;i<sn;i++){
    ctx.beginPath(); ctx.moveTo(x+w,y+i*16+8); ctx.lineTo(x+w+14,y+i*16+8); ctx.lineTo(x+w,y+i*16+16); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x,y+i*16+8);   ctx.lineTo(x-14,y+i*16+8);   ctx.lineTo(x,y+i*16+16);   ctx.closePath(); ctx.fill();
  }
}
function checkSpikeWall(t){ return overlap(P,{x:t.x-14,y:t.y,w:44,h:t.h||80}); }

// ── PRESSURE PAD ──
function initPressure(t){ t._on=false; t._timer=0; }
function updatePressure(t){
  const near=!P.dead&&P.x+P.w>t.x-4&&P.x<t.x+t.w+4&&P.y+P.h>=t.y-2&&P.y+P.h<=t.y+10;
  if(near&&!t._on) t._on=true;
  if(t._on){ t._timer++; if(t._timer>90){t._on=false;t._timer=0;} }
}
function drawPressure(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||48, h=8;
  ctx.fillStyle=t._on?'#cc2200':'#445566'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=t._on?'#ff4400':'#223';
  for(let i=0;i<3;i++) ctx.fillRect(x+5+i*16,y+2,8,4);
  if(t._on){
    ctx.fillStyle='#cc4400'; const sn=Math.floor(w/12);
    for(let i=0;i<sn;i++){
      ctx.beginPath(); ctx.moveTo(x+i*12+6,y-20); ctx.lineTo(x+i*12,y); ctx.lineTo(x+i*12+12,y); ctx.closePath(); ctx.fill();
    }
  }
}
function checkPressure(t){ return t._on && overlap(P,{x:t.x,y:t.y-20,w:t.w||48,h:20}); }

// ── FAKE PLATFORM ──
function drawFakePlat(t){
  const x=sx(t.x), y=sy(t.y), w=t.w||64, h=14;
  ctx.fillStyle='#334455'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,w,3);
  // subtle red pulse — barely noticeable
  ctx.save(); ctx.globalAlpha=0.06+Math.sin(Date.now()/900)*0.04;
  ctx.fillStyle='#f00'; ctx.fillRect(x,y,w,h); ctx.restore();
}
// fake platform is never added to collision list

// ── BOMB ──
function initBomb(t){ t._fuse=0; t._boom=false; t._boomT=0; }
function updateBomb(t){
  if(t._boom){ t._boomT++; if(t._boomT>55){t._boom=false;t._fuse=0;t._boomT=0;} return; }
  if(!P.dead&&dist(P.x+P.w/2,P.y+P.h/2,t.x,t.y)<90) t._fuse++;
  else if(t._fuse>0) t._fuse=Math.max(0,t._fuse-1);
  if(t._fuse>95) t._boom=true;
}
function drawBomb(t){
  if(t._boom){
    const r=75*(1-t._boomT/55), al=(1-t._boomT/55)*0.85;
    ctx.save(); ctx.globalAlpha=al;
    const rg=ctx.createRadialGradient(sx(t.x),sy(t.y),2,sx(t.x),sy(t.y),r);
    rg.addColorStop(0,'#fff'); rg.addColorStop(0.2,'#ff8'); rg.addColorStop(0.6,'#f60'); rg.addColorStop(1,'rgba(200,50,0,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(sx(t.x),sy(t.y),r,0,Math.PI*2); ctx.fill(); ctx.restore(); return;
  }
  const x=sx(t.x), y=sy(t.y), angry=t._fuse>50;
  ctx.fillStyle=angry?'#cc2200':'#334'; ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc8800'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y-15); ctx.quadraticCurveTo(x+12,y-28,x+8,y-36); ctx.stroke();
  if(angry){ ctx.fillStyle='#fc0'; ctx.beginPath(); ctx.arc(x+8,y-36,4,0,Math.PI*2); ctx.fill(); }
  ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('💣',x,y+5);
}
function checkBomb(t){ return t._boom && dist(P.x+P.w/2,P.y+P.h/2,t.x,t.y)<72; }

const LEVELS = [LV1, LV2, LV3, LV4, LV5];

// ═══════════════════════════════════
// GAME STATE
// ═══════════════════════════════════
let curLvl   = null;
let lvIdx    = 0;
let traps    = [];
let sPlats   = [];   // static platforms
let gameState= 'menu';
let hintIdx  = 0;
let hintTimer= 0;

function loadLevel(idx){
  curLvl = LEVELS[idx];
  // deep-clone traps, init state
  traps  = curLvl.traps.map(t => { const c={...t}; initTrap(c); return c; });
  sPlats = [...curLvl.plats];
  P      = makePlayer(curLvl.spawn.x, curLvl.spawn.y);
  camX   = 0; camY = 0; parts = [];
  hintIdx= 0; hintTimer = 0;
  document.getElementById('hname').textContent = `FASE ${idx+1} — ${curLvl.name}`;
  document.getElementById('hhint').textContent = curLvl.hints[0]||'';
  deathCb = () => { P = makePlayer(curLvl.spawn.x, curLvl.spawn.y); };
}

// build platform list for this frame
function getPlatforms(){
  const all = [...sPlats];
  for(const t of traps){
    const r = TR[t.type];
    if(!r) continue;
    if(r.plat === 'static') all.push({x:t.x,y:t.y,w:t.w||80,h:t.h||14});
    if(r.plat === 'dyn' && t._vis) all.push({x:t.x,y:t.y,w:t.w||64,h:14});
    if(r.plat === 'crm' && !t._broken) all.push({x:t.x,y:t.y,w:t.w||64,h:14});
  }
  return all;
}

function showWin(){
  gameState = 'win';
  for(let i=0;i<40;i++) burst(P.x+P.w/2,P.y,['#ff0','#f80','#0f0','#0ff','#fff'][i%5],3+Math.random()*4);
  const ov = document.getElementById('overlay');
  if(lvIdx >= LEVELS.length-1){
    ov.innerHTML = `<h1>🏆 VOCÊ VENCEU!</h1>
      <p style="color:#f64;font-size:15px">Parabéns, sobrevivente do inferno.</p>
      <p>Mortes totais: <b style="color:#f30">${deaths}</b></p>
      <p style="color:#888;font-size:12px">Você é dos poucos que chegou aqui.</p>
      <button class="obtn" id="rbtn">JOGAR DE NOVO</button>`;
    ov.style.display='flex';
    document.getElementById('rbtn').onclick=()=>{ lvIdx=0;deaths=0;document.getElementById('hdk').textContent=0;ov.style.display='none';gameState='playing';loadLevel(0); };
  } else {
    ov.innerHTML = `<h1>⭐ FASE ${lvIdx+1} COMPLETA!</h1>
      <p style="color:#fa0">Você sobreviveu... por enquanto.</p>
      <p>Mortes: <b style="color:#f30">${deaths}</b></p>
      <button class="obtn" id="nbtn">PRÓXIMA FASE →</button>`;
    ov.style.display='flex';
    document.getElementById('nbtn').onclick=()=>{ lvIdx++;ov.style.display='none';gameState='playing';loadLevel(lvIdx); };
  }
}

// ═══════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════
let lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  lastT = ts;
  if(gameState !== 'playing') return;

  // update traps
  for(const t of traps){
    const r = TR[t.type];
    if(r) r.update(t, curLvl);
  }

  // update player
  updatePlayer(getPlatforms());

  // check trap collisions
  if(!P.dead){
    for(const t of traps){
      const r = TR[t.type];
      if(r && r.check(t)){ die(); break; }
    }
  }

  // goal check
  if(!P.dead && overlap(P,{x:curLvl.goal.x,y:curLvl.goal.y,w:curLvl.goal.w,h:curLvl.goal.h})) showWin();

  // hints
  if(++hintTimer > 330){ hintTimer=0; hintIdx=(hintIdx+1)%curLvl.hints.length; document.getElementById('hhint').textContent=curLvl.hints[hintIdx]; }

  updateParts();
  updateCam();

  // ── RENDER ──
  drawBG();
  drawPlatforms(sPlats);

  // platform-type traps
  for(const t of traps){
    const r=TR[t.type];
    if(r&&(r.plat==='static'||r.plat==='dyn'||r.plat==='crm')) r.draw(t);
  }

  // regular traps (not dark)
  for(const t of traps){
    const r=TR[t.type];
    if(r&&r.plat===null&&t.type!=='dark') r.draw(t);
  }

  // dark zones go on top of everything except player
  for(const t of traps){ if(t.type==='dark') drawDark(t); }

  drawParts();
  drawPlayer();
  drawGoal(curLvl.goal);

  // progress bar
  const pct=Math.min(1,Math.max(0,(P.x-30)/(curLvl.goal.x-60)));
  document.getElementById('pfill').style.width=(pct*100)+'%';
  document.getElementById('pfill').style.background=`hsl(${pct*120},100%,45%)`;
}

// ── START ──
document.getElementById('sbtn').onclick = () => {
  document.getElementById('overlay').style.display='none';
  gameState='playing';
  loadLevel(0);
  setupMobile();
  requestAnimationFrame(loop);
};
window.addEventListener('keydown', e => {
  if(e.code==='KeyR' && gameState==='playing') loadLevel(lvIdx);
});
